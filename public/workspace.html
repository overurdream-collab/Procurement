<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Request Intelligence Workspace</title><style>
:root{font-family:system-ui;background:#030A28;color:#e8eefc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1280px;margin:auto;padding:24px}.top,.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.card{background:#0b1638;border:1px solid #20325f;border-radius:18px;padding:18px;margin-top:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:9px 12px;border-radius:10px;background:#071331;border:1px solid #29406f;cursor:pointer}.tab.active{background:#2563eb}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.item{background:#071331;border:1px solid #29406f;border-radius:12px;padding:12px;margin:9px 0}.meta{font-size:12px;color:#9fb0d4;margin-top:6px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;background:#2563eb;color:white}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #334a7d;background:#071331;color:white}.composer{display:grid;grid-template-columns:1fr auto;gap:8px}.chat{max-height:520px;overflow:auto}.msg{padding:11px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.user{background:#173266}.assistant{background:#17243e}.badge{font-size:11px;padding:3px 7px;border:1px solid #36558e;border-radius:20px}.muted{color:#9fb0d4}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.composer{grid-template-columns:1fr}}</style></head><body><div class="wrap">
<div class="top"><div><h1 id="title">Request Intelligence Workspace</h1><div id="sub" class="muted">مصدر الحقيقة المشترك لجميع AI Agents</div></div><a class="btn" href="/">لوحة التحكم</a></div>
<div class="tabs" id="tabs"></div><div class="grid"><main class="card"><div class="row"><h2 id="sectionTitle"></h2><span class="badge">Shared Agent Context</span></div><div id="items"></div><div class="card"><select id="status"><option>Confirmed Decision</option><option>Verified Fact</option><option>Supplier Claim</option><option>AI Estimate</option><option>Pending Verification</option></select><textarea id="value" rows="3" placeholder="أضف معلومة أو قاعدة أو مواصفة..."></textarea><button class="btn" id="add">إضافة للسياق</button></div></main>
<aside class="card"><h2>Procurement AI Copilot</h2><p class="muted">اسأل، أو أعطِ أمرًا. الأوامر المدعومة تنفذ على Workspace وتظهر في سجل التغييرات.</p><div id="chat" class="chat"></div><div class="composer"><textarea id="message" rows="3" placeholder="مثال: التجميع والتركيب سيكون في صنعاء"></textarea><button class="btn" id="send">إرسال وتنفيذ</button></div></aside></div></div>
<script>
const id=new URLSearchParams(location.search).get('id')||'RFQ-001',defs={specifications:'المواصفات',analysisRules:'آلية التحليل',commercialTerms:'الشروط التجارية',supplierStrategy:'استراتيجية الموردين',scenarios:'السيناريوهات',facts:'المعلومات والقرارات',aiInstructions:'تعليمات AI',changeHistory:'سجل التغييرات'};let data,section='specifications';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){let r=await fetch('/api/requests/'+encodeURIComponent(id)+'/workspace');data=await r.json();if(!r.ok){document.body.innerHTML='<div class="wrap">Request not found</div>';return}document.getElementById('title').textContent=data.request.id+' — '+data.request.title;render()}
function render(){tabs.innerHTML=Object.entries(defs).map(([k,v])=>'<button class="tab '+(k===section?'active':'')+'" data-k="'+k+'">'+v+'</button>').join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.k;render()});sectionTitle.textContent=defs[section];let a=data.workspace[section]||[];items.innerHTML=a.length?a.map(x=>'<div class="item">'+esc(x.value||x.text)+'<div class="meta">'+esc(x.status||x.kind||'')+' · '+esc(x.source||'')+' · '+esc(x.updatedAt||x.time||'')+'</div></div>').join(''):'<p class="muted">لا توجد عناصر بعد.</p>';document.querySelector('.card .card').style.display=section==='changeHistory'?'none':'block';chat.innerHTML=(data.workspace.chat||[]).map(x=>'<div class="msg '+esc(x.role)+'">'+esc(x.text)+'</div>').join('');chat.scrollTop=chat.scrollHeight}
add.onclick=async()=>{if(!value.value.trim())return;let r=await fetch('/api/requests/'+id+'/workspace',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({section,value:value.value,status:status.value,source:'Manual UI'})});let x=await r.json();if(r.ok){data.workspace=x.workspace;value.value='';render()}else alert(x.error)}
send.onclick=async()=>{let m=message.value.trim();if(!m)return;message.value='';let r=await fetch('/api/requests/'+id+'/copilot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let x=await r.json();if(r.ok){data.workspace=x.workspace;render()}else alert(x.error)}
load();
</script></body></html>
