<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Record</title><style>body{font-family:Segoe UI,Tahoma,Arial;background:#f8fafc;color:#0f172a;margin:0}main{max-width:1100px;margin:auto;padding:24px}.top,.actions{display:flex;justify-content:space-between;gap:10px;align-items:center}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:14px 0}.event{border-inline-start:4px solid #2563eb;padding:12px 16px;margin:10px 0;background:#f8fafc;border-radius:10px}.mail{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2563eb;color:white;cursor:pointer;text-decoration:none}.muted{color:#64748b}.bad{color:#dc2626}.hidden{display:none}body[dir=ltr]{font-family:Segoe UI,Arial}@media(max-width:700px){.top{align-items:flex-start;flex-direction:column}}</style></head><body><main><div class="top"><div><h1 id="name">Supplier Record</h1><div id="status" class="muted"></div></div><div class="actions"><button class="btn" onclick="lang()">AR / EN</button><a class="btn" href="/">Dashboard</a></div></div><section class="card"><h2 data-ar="المعلومات الناقصة" data-en="Missing information">المعلومات الناقصة</h2><div id="missing"></div></section><section class="card"><h2 data-ar="التسلسل الزمني" data-en="Timeline">التسلسل الزمني</h2><div id="timeline"></div></section><section class="card"><div class="top"><h2 data-ar="الإيميلات" data-en="Emails">الإيميلات</h2><button class="btn" onclick="document.getElementById('emails').classList.toggle('hidden')" data-ar="إظهار / إخفاء الإيميلات" data-en="Show / Hide Emails">إظهار / إخفاء الإيميلات</button></div><div id="emails" class="hidden"></div></section></main><script>let en=false,d;const id=new URLSearchParams(location.search).get('id');const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function load(){let r=await fetch('/api/suppliers/'+encodeURIComponent(id)+'/record');d=await r.json();name.textContent=d.supplier.name;status.textContent=d.supplier.status||'';missing.innerHTML=d.missing.length?d.missing.map(x=>'<div class="bad">✕ '+e(x)+'</div>').join(''):'✓ Complete';timeline.innerHTML=[...(d.events||[]),...(d.emails||[]).map(x=>({time:x.date||x.time||x.createdAt,text:(x.direction==='sent'?'Sent: ':'Email: ')+(x.subject||x.snippet||'')}))].sort((a,b)=>new Date(a.time)-new Date(b.time)).map(x=>'<div class="event"><b>'+e(x.time||'')+'</b><div>'+e(x.text||'')+'</div></div>').join('')||'<div class="muted">No recorded events</div>';emails.innerHTML=(d.emails||[]).map(x=>'<div class="mail"><b>'+e(x.subject||'Email')+'</b><div class="muted">'+e(x.date||x.time||'')+' · '+e(x.from||'')+' → '+e(x.to||'')+'</div><p>'+e(x.body||x.snippet||'')+'</p></div>').join('')||'<div class="muted">No emails stored for this supplier.</div>'}function lang(){en=!en;document.documentElement.lang=en?'en':'ar';document.documentElement.dir=en?'ltr':'rtl';document.body.dir=en?'ltr':'rtl';document.querySelectorAll('[data-ar]').forEach(x=>x.textContent=en?x.dataset.en:x.dataset.ar)}load();</script></body></html>
