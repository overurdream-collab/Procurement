<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Procurement Request</title><style>
:root{font-family:system-ui;background:#030A28;color:#e8eefc}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.card{background:#0b1638;border:1px solid #20325f;border-radius:18px;padding:22px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-weight:700}input,textarea,select{padding:12px;border-radius:10px;border:1px solid #334a7d;background:#071331;color:#fff}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.ai{background:#7c3aed}.muted{color:#9fb0d4}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#071331;border:1px solid #29406f;border-radius:14px;padding:16px}.kpi b{font-size:24px;display:block;margin-top:8px}.sources{display:grid;gap:8px}.source{padding:10px;border:1px solid #29406f;border-radius:10px}@media(max-width:700px){.grid,.kpis{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>طلب مشتريات جديد</h1><div class="muted">New Procurement Request → AI Market Intelligence → Supplier Discovery → RFQ</div></div><a class="btn" href="/">العودة للوحة التحكم</a></div>
<div class="card"><form id="f"><div class="grid">
<label>اسم المشروع / الطلب<input name="title" required></label><label>المنتج أو المادة<input name="product" required></label>
<label>الكمية<input name="quantity"></label><label>بلد التسليم<input name="deliveryCountry"></label>
<label>الأسواق المستهدفة<input name="targetMarkets" placeholder="China, Oman, Global"></label><label>العملة<input name="currency" value="USD"></label>
<label>Incoterm<input name="incoterm" value="FOB"></label><label>موعد الاحتياج<input name="neededBy" type="date"></label></div>
<label style="margin-top:14px">المواصفات<textarea name="specifications" rows="5"></textarea></label><label style="margin-top:14px">ملاحظات<textarea name="notes" rows="2"></textarea></label>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn" type="submit" data-mode="save">حفظ الطلب</button><button class="btn ai" type="submit" data-mode="scan">حفظ + Run AI Market Scan</button></div></form></div><div id="out"></div></div>
<script>
const out=document.getElementById('out');const money=n=>n==null?'—':'$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();let mode=e.submitter.dataset.mode,b=Object.fromEntries(new FormData(e.target));out.innerHTML='<div class="card">جارٍ إنشاء الطلب…</div>';let r=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),x=await r.json();if(!r.ok)return out.innerHTML='<div class="card">'+(x.error||'Error')+'</div>';if(mode==='save')return out.innerHTML='<div class="card"><b>تم إنشاء '+x.id+'</b></div>';out.innerHTML='<div class="card">AI Market Intelligence يبحث ويحلل المصادر المتاحة…</div>';let s=await fetch('/api/requests/'+x.id+'/market-scan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}),m=await s.json();if(!s.ok)return out.innerHTML='<div class="card">'+(m.error||'Market scan failed')+'</div>';let bmk=m.benchmark||{};out.innerHTML='<div class="card"><h2>Market Intelligence Report</h2><div class="kpis"><div class="kpi">Low<b>'+money(bmk.low)+'</b></div><div class="kpi">Median<b>'+money(bmk.median)+'</b></div><div class="kpi">High<b>'+money(bmk.high)+'</b></div><div class="kpi">Confidence<b>'+m.confidence+'%</b></div></div><h3>Target negotiation range: '+money(bmk.targetLow)+' — '+money(bmk.targetHigh)+'</h3><p class="muted">Sources analyzed: '+m.sourceCount+' | Mode: '+m.mode+'</p><p class="muted">'+m.disclaimer+'</p><div class="sources">'+(m.sources||[]).map(z=>'<div class="source"><b>'+z.type+'</b> — '+z.title+(z.url?' · <a style="color:#7dd3fc" target="_blank" href="'+z.url+'">source</a>':'')+'</div>').join('')+'</div></div>'});
</script></body></html>
