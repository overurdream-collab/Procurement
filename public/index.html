<!doctype html>
<html lang="ar" dir="rtl" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F172A"><title>Procurement Command Center</title>
<style>
:root{--bg:#F8FAFC;--card:#fff;--card2:#F1F5F9;--glass:rgba(255,255,255,.88);--line:#E2E8F0;--text:#0F172A;--muted:#64748B;--blue:#2563EB;--cyan:#06B6D4;--red:#EF4444;--orange:#F97316;--green:#22C55E;--purple:#8B5CF6;--teal:#14B8A6;--amber:#F59E0B;--shadow:0 1px 2px rgba(15,23,42,.05),0 12px 28px -18px rgba(15,23,42,.30)}
[data-theme=dark]{--bg:#020617;--card:#0F172A;--card2:#131E36;--glass:rgba(15,23,42,.88);--line:#1E293B;--text:#E2E8F0;--muted:#94A3B8;--blue:#38BDF8;--cyan:#22D3EE;--red:#F87171;--orange:#FB923C;--green:#4ADE80;--purple:#A78BFA;--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 32px -20px rgba(0,0,0,.8)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background-color:var(--bg);color:var(--text);background-image:radial-gradient(900px 520px at 90% -10%,rgba(37,99,235,.09),transparent 60%),linear-gradient(rgba(37,99,235,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.035) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
.hero{color:#E2E8F0;background:linear-gradient(120deg,#0F172A 0%,#132a63 38%,#0c4a6e 68%,#0F172A 100%);background-size:240% 240%;padding:22px 0;box-shadow:0 12px 34px -26px #020617}.hero-in{max-width:1440px;margin:auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#2563EB,#06B6D4);box-shadow:0 12px 30px -10px rgba(6,182,212,.8)}h1{margin:0;font-size:26px}.sub{color:#93C5FD;margin-top:4px}.rfq{text-align:left}.rfq small{display:block;color:#7DD3FC;font-weight:700}.rfq b{font-size:32px}
.controls{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.controls-in{max-width:1440px;margin:auto;padding:9px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);height:36px;border-radius:10px;padding:0 13px;font-weight:650;cursor:pointer}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.primary{border:0;color:#fff;background:linear-gradient(135deg,#2563EB,#06B6D4)}.danger{color:var(--red)}.ai{border:0;color:#fff;background:linear-gradient(135deg,#8B5CF6,#2563EB)}
main{max-width:1440px;margin:auto;padding:4px 24px 40px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}.kpi{--k:var(--blue);position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);overflow:hidden}.kpi.clickable{cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.kpi.clickable:hover{transform:translateY(-2px);box-shadow:0 16px 34px -20px var(--k);border-color:color-mix(in srgb,var(--k) 45%,var(--line))}.kpi.clickable:focus{outline:3px solid color-mix(in srgb,var(--k) 24%,transparent);outline-offset:2px}.kpi .go{position:absolute;left:14px;top:14px;color:var(--muted);font-weight:900}.kpi:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--k),transparent)}.ki{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,transparent);color:var(--k);font-weight:900}.kl{font-size:11px;font-weight:800;color:var(--muted);margin-top:10px}.kv{font-size:29px;font-weight:800;margin-top:5px}.kd{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:20px 0}.ph{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}.pi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(37,99,235,.10);color:var(--blue);font-weight:900}.ph h2{margin:0;font-size:16.5px}.pb{padding:17px 18px}.muted{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11.5px;color:var(--muted);background:var(--card2)}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:right}.status{display:inline-flex;padding:4px 9px;border-radius:999px;background:rgba(37,99,235,.10);color:var(--blue);font-weight:700}.score{min-width:52px;text-align:center;font-weight:800}.score.low{color:var(--red)}.score.mid{color:var(--orange)}.score.high{color:var(--green)}.missing{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10.5px;padding:3px 7px;border-radius:999px;background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.16)}.safe{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(34,197,94,.10);color:var(--green);font-weight:800;font-size:12px}.log{padding:10px 0;border-bottom:1px solid var(--line)}.approval{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.toast{position:fixed;left:20px;bottom:20px;background:#0F172A;color:white;padding:11px 15px;border-radius:10px;display:none;z-index:50}
.mobile{display:none}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.hero-in{padding:0 15px}.controls-in,main{padding-left:14px;padding-right:14px}.controls-in .navwide{display:none}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0F172A;padding:8px;z-index:40;justify-content:space-around}.mobile button{background:transparent;border:0;color:#fff;padding:8px}.rfq b{font-size:24px}main{padding-bottom:80px}}@media(max-width:520px){.hero{padding:15px 0}.hero-in{gap:12px}.brand{gap:10px}.logo{width:42px;height:42px;border-radius:12px}.sub{font-size:12px}.rfq{width:100%;display:flex;align-items:center;gap:8px;text-align:right}.rfq small{display:inline}.rfq b{font-size:20px}.kpis{grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:13px}.kv{font-size:24px}h1{font-size:18px}.panel{border-radius:14px;margin:14px 0}.pb{padding:13px 12px}th,td{padding:9px 8px;white-space:nowrap}.controls-in{overflow-x:auto;flex-wrap:nowrap}.controls-in .grow{display:none}.controls-in>.btn{flex:0 0 auto}.toast{left:12px;right:12px;bottom:72px;text-align:center}}
</style></head><body>
<header class="hero"><div class="hero-in"><div class="brand"><div class="logo">P</div><div><h1>PROCUREMENT COMMAND CENTER</h1><div class="sub">Alharir shipping and export · مركز قيادة المشتريات</div></div></div><div class="rfq"><small>ACTIVE PROCUREMENT</small><b>RFQ-001</b><div class="sub">Cold Storage Project</div></div></div></header>
<nav class="controls"><div class="controls-in"><button class="btn primary" onclick="show('dashboard')">⌂ لوحة التحكم</button><button class="btn navwide" onclick="show('suppliers')">الموردون</button><button class="btn navwide" onclick="show('quotes')">مقارنة العروض</button><button class="btn navwide" onclick="show('approvals')">الموافقات</button><button class="btn navwide" onclick="show('reports')">التقارير</button><div class="grow"></div><button class="btn ai" onclick="show('agent')">✦ AI Assistant</button><button class="btn" onclick="theme()">◐</button></div></nav>
<main><div id="view"></div></main><nav class="mobile"><button onclick="show('dashboard')">الرئيسية</button><button onclick="show('suppliers')">الموردون</button><button onclick="show('quotes')">العروض</button><button onclick="show('agent')">AI</button></nav><div class="toast" id="toast"></div>
<script>
let st={};const A='/api/';async function load(){let saved=localStorage.getItem('procurement-theme');if(saved)document.documentElement.dataset.theme=saved;st=await fetch(A+'state').then(r=>r.json());show(location.hash.slice(1)||'dashboard')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function theme(){let h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';localStorage.setItem('procurement-theme',h.dataset.theme)}function show(v){location.hash=v;let el=document.getElementById('view');if(v==='dashboard')el.innerHTML=dashboard();if(v==='rfq')el.innerHTML=rfqView();if(v==='suppliers')el.innerHTML=suppliers();if(v==='responses')el.innerHTML=responses();if(v==='quotes')el.innerHTML=quotes();if(v==='approvals')el.innerHTML=approvals();if(v==='agent')el.innerHTML=agent();if(v==='reports')el.innerHTML=reports();window.scrollTo({top:0,behavior:'smooth'})}
function kpi(label,val,desc,color,icon,target){let a=target?' clickable':'';let attrs=target?' role="button" tabindex="0" onclick="show(\''+target+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();show(\''+target+'\')}"':'';return '<div class="kpi'+a+'" style="--k:'+color+'"'+attrs+'>'+(target?'<span class="go">←</span>':'')+'<div class="ki">'+icon+'</div><div class="kl">'+label+'</div><div class="kv">'+val+'</div><div class="kd">'+desc+'</div></div>'}
function panel(title,icon,body){return '<section class="panel"><div class="ph"><div class="pi">'+icon+'</div><h2>'+title+'</h2></div><div class="pb">'+body+'</div></section>'}
function hasReply(x){return /رد|عرض|Benchmark/i.test(x.status||'')}function compliance(s){let m=st.rfqCompliance?.requiredMetrics||[],q=st.quotes.filter(x=>x.supplierId===s.id),filled=0;if(q.length){let z=q[0];filled=m.filter(x=>z[x.key]!==undefined&&z[x.key]!==null&&z[x.key]!=='').length}return {score:m.length?Math.round(filled/m.length*100):0,missing:m.filter(x=>!q.length||q[0][x.key]===undefined||q[0][x.key]===null||q[0][x.key]==='')}}function dashboard(){let replied=st.suppliers.filter(hasReply).length,pending=st.approvals.filter(x=>x.status==='pending').length;return '<div class="kpis">'+kpi('RFQ نشطة','1','اضغط لعرض تفاصيل الطلب','#2563EB','R','rfq')+kpi('الموردون',st.suppliers.length,'اضغط لعرض جميع الموردين','#06B6D4','S','suppliers')+kpi('الردود',replied,'اضغط لعرض الموردين الذين ردوا','#22C55E','↩','responses')+kpi('موافقات معلقة',pending,'اضغط لاتخاذ القرار','#F97316','!','approvals')+'</div><div class="grid">'+panel('Supplier Pipeline — RFQ-001','S',supplierTable())+panel('Agent Activity','✦',st.activity.slice(0,8).map(x=>'<div class="log">'+x.text+'<br><small class="muted">'+x.time+'</small></div>').join(''))+'</div>'}
function supplierTable(){let labels={coolingLoadKw:'Cooling kW',storageTons:'Storage tons',dailyLoadingTpd:'tons/day',pullDown:'Pull-down',energyKwh24h:'kWh/24h'};return '<div style="overflow:auto"><table><thead><tr><th>المورد</th><th>الحالة</th><th>Compliance</th><th>البيانات الناقصة</th><th>الإجراء المطلوب</th></tr></thead><tbody>'+st.suppliers.map(s=>{let c=compliance(s),cl=c.score>=80?'high':c.score>=40?'mid':'low',mail=s.email||'البريد غير مؤكد',action=!s.email?'تحقق من بيانات التواصل':c.score<100?(hasReply(s)?'استخراج البيانات الفنية':'انتظار/متابعة الرد'):'جاهز للمقارنة';return '<tr><td><b>'+s.name+'</b><br><small class="muted">'+mail+'</small></td><td><span class="status">'+s.status+'</span></td><td><span class="score '+cl+'">'+c.score+'%</span></td><td><div class="missing">'+(c.missing.length?c.missing.map(x=>'<span class="chip">'+labels[x.key]+'</span>').join(''):'<span class="safe">✓ مكتمل</span>')+'</div></td><td><b>'+action+'</b><br><button class="btn" style="margin-top:6px" onclick="exclude(\''+s.id+'\','+!s.excluded+')">'+(s.excluded?'إلغاء الاستبعاد':'استبعاد')+'</button></td></tr>'}).join('')+'</tbody></table></div>'}
function rfqView(){let r=st.requests?.find(x=>x.id===st.project?.activeRfq)||st.requests?.[0]||{};let d=r.designBasis||{};return panel('تفاصيل طلب الشراء — '+(r.id||'RFQ'),'R','<div class="grid" style="grid-template-columns:1fr 1fr"><div><p><b>المشروع:</b> '+(r.title||st.project?.name||'-')+'</p><p><b>الحالة:</b> <span class="status">'+(r.status||'-')+'</span></p><p><b>تاريخ الإنشاء:</b> '+(r.createdAt||'-')+'</p></div><div><p><b>الاستخدام:</b> '+(d.application||'-')+'</p><p><b>درجة الحرارة:</b> '+(d.temperature||'-')+'</p><p><b>المقاسات:</b> '+((d.roomSizes||[]).join(' — ')||'-')+'</p></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="show(\'suppliers\')">عرض الموردين</button><button class="btn" onclick="show(\'quotes\')">مقارنة العروض</button></div>')}
function responses(){let replied=st.suppliers.filter(hasReply);return panel('ردود الموردين','↩',replied.length?'<div style="overflow:auto"><table><thead><tr><th>المورد</th><th>الحالة</th><th>البريد</th><th>الإجراء</th></tr></thead><tbody>'+replied.map(s=>'<tr><td><b>'+s.name+'</b></td><td><span class="status">'+s.status+'</span></td><td>'+(s.email||'<span class="muted">غير مؤكد</span>')+'</td><td><button class="btn" onclick="show(\'suppliers\')">فتح سجل المورد</button></td></tr>').join('')+'</tbody></table></div>':'<div class="muted">لا توجد ردود مسجلة حتى الآن.</div>')}
function suppliers(){return panel('الموردون','S',supplierTable())}function quotes(){return panel('مقارنة عروض الأسعار','Q',st.quotes.length?'<pre>'+JSON.stringify(st.quotes,null,2)+'</pre>':'<div class="muted">لم يتم إدخال عروض بعد. ستظهر هنا بعد استخراج ردود الموردين.</div>')}function approvals(){return panel('Approval Center','✓',st.approvals.map(a=>'<div class="approval"><b>'+a.title+'</b><div class="muted">'+a.status+'</div><div class="actions" style="margin-top:9px"><button class="btn primary" onclick="approve(\''+a.id+'\',\'approved\')">موافقة</button><button class="btn danger" onclick="approve(\''+a.id+'\',\'rejected\')">رفض</button></div></div>').join(''))}
function agent(){let g=st.gmail||{},safe=st.settings?.dryRun||st.settings?.requirePerMessageApproval;return '<div class="grid">'+panel('Procurement AI Assistant','✦','<div class="safe">🛡 '+(safe?'وضع الحماية مفعل — لا يوجد إرسال جماعي':'تحذير: راجع إعدادات الإرسال')+'</div><div style="margin-top:12px">Gmail: <b>'+(g.connected?'متصل':g.configured?'جاهز للربط':'يحتاج إعداد OAuth')+'</b></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="connectGmail()">ربط Gmail</button><button class="btn" onclick="sync()">مزامنة RFQ-001</button><button class="btn" onclick="followup()">متابعة الموردين</button></div>')+panel('صلاحيات الوكيل','⚙',Object.entries(st.settings).map(([k,v])=>'<label style="display:flex;justify-content:space-between;padding:9px 0"><span>'+k+'</span><input type="checkbox" '+(v?'checked':'')+' onchange="setting(\''+k+'\',this.checked)"></label>').join(''))+'</div>'}function reports(){let ready=st.suppliers.filter(x=>compliance(x).score===100).length;return panel('التقارير','▤','<p>RFQ-001 — الموردون: '+st.suppliers.length+' — الردود/العروض: '+st.suppliers.filter(hasReply).length+' — العروض المدخلة: '+st.quotes.length+' — مكتملو المؤشرات الخمسة: '+ready+'</p><p class="muted">قاعدة القرار: '+(st.rfqCompliance?.rule||'')+'</p>')}
async function approve(id,status){await fetch(A+'approvals/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await load();toast('تم تحديث الموافقة')}async function exclude(id,excluded){await fetch(A+'suppliers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({excluded})});await load()}async function setting(k,v){await fetch(A+'settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:v})});await load()}function connectGmail(){location.href=A+'gmail/connect'}async function sync(){let r=await fetch(A+'gmail/sync',{method:'POST'}),x=await r.json();if(!r.ok)return toast(x.error||'فشل الربط');await load();toast('ردود جديدة: '+x.added)}async function followup(){let r=await fetch(A+'agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'followup'})}),x=await r.json();if(!r.ok)return toast(x.message||x.error);await load();toast('تمت المتابعة: '+x.sent.length)}load();
</script></body></html>
