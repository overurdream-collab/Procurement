function icon(n){const p={home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/>',users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',reply:'<path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/>',check:'<path d="m4 12 5 5L20 6"/>',report:'<path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h8"/>',spark:'<path d="m12 3 1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6Z"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',chart:'<path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/>',scale:'<path d="M12 3v18M5 7h14M7 7l-4 7h8L7 7Zm10 0-4 7h8l-4-7Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/>'};return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+(p[n]||p.report)+'</svg>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let st={};const A='/api/';async function load(){let saved=localStorage.getItem('procurement-theme');if(saved)document.documentElement.dataset.theme=saved;st=await fetch(A+'state').then(r=>r.json());render(location.hash.slice(1)||'dashboard')};window.addEventListener('hashchange',()=>render(location.hash.slice(1)||'dashboard'));function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function theme(){let h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';localStorage.setItem('procurement-theme',h.dataset.theme)}function show(v){if(location.hash!=='#'+v)location.hash=v;else render(v)}function render(v){let el=document.getElementById('view');if(v==='dashboard')el.innerHTML=dashboard();if(v==='rfq')el.innerHTML=rfqView();if(v==='suppliers')el.innerHTML=suppliers();if(v==='responses')el.innerHTML=responses();if(v==='quotes')el.innerHTML=quotes();if(v==='approvals')el.innerHTML=approvals();if(v==='agent')el.innerHTML=agent();if(v==='reports')el.innerHTML=reports();if(v==='market')el.innerHTML=market();window.scrollTo({top:0,behavior:'smooth'})}
function kpi(label,val,desc,color,ico,target){let a=target?' clickable':'';let attrs=target?' role="button" tabindex="0" onclick="show(\''+target+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();show(\''+target+'\')}"':'';return '<div class="kpi'+a+'" style="--k:'+color+'"'+attrs+'><div class="k-top"><div class="k-icon">'+icon(ico)+'</div><div class="k-label">'+label+'</div></div><div class="k-tag">'+desc+'</div><div class="k-sep"></div><div class="k-val">'+val+'</div><div class="k-desc">'+desc+'</div><div class="k-go">فتح التفاصيل ←</div></div>'}
function panel(title,icon,body){return '<section class="panel"><div class="ph"><div class="pi">'+icon+'</div><h2>'+title+'</h2></div><div class="pb">'+body+'</div></section>'}
function allReplies(){return (st.gmailReplies||[]).slice().sort((a,b)=>new Date(b.receivedAt||0)-new Date(a.receivedAt||0))}
function replyCount(){return allReplies().length}
function supplierMails(id){return allReplies().filter(m=>m.supplierId===id)}
function hasReply(x){return supplierMails(x.id).length>0}function compliance(s){let m=st.rfqCompliance?.requiredMetrics||[],q=st.quotes.filter(x=>x.supplierId===s.id),filled=0;if(q.length){let z=q[0];filled=m.filter(x=>z[x.key]!==undefined&&z[x.key]!==null&&z[x.key]!=='').length}return {score:m.length?Math.round(filled/m.length*100):0,missing:m.filter(x=>!q.length||q[0][x.key]===undefined||q[0][x.key]===null||q[0][x.key]==='')}}function pipelineChart(){let total=st.suppliers.length||1,replied=st.suppliers.filter(hasReply).length,replyEmails=replyCount(),mail=st.suppliers.filter(s=>s.email).length,ready=st.suppliers.filter(s=>compliance(s).score===100).length,pending=st.approvals.filter(a=>a.status==='pending').length,c=2*Math.PI*78,vals=[replied,mail,ready],cols=['#2563EB','#06B6D4','#EF4444'],labs=['موردون لديهم ردود','بريد مؤكد','مكتمل فنيًا'],off=0;let segs=vals.map((v,i)=>{let len=c*(v/total),z='<circle cx="110" cy="110" r="78" stroke="'+cols[i]+'" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'"/>';off+=len;return z}).join('');return '<div class="chart-grid"><div class="donut-wrap"><svg class="donut" viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="78"/>'+segs+'</svg><div class="donut-center"><b>'+total+'</b><span>إجمالي الموردين</span></div></div><div><div class="chart-legend">'+labs.map((l,i)=>'<div class="leg"><span class="dot" style="background:'+cols[i]+'"></span><span>'+l+'</span><b>'+vals[i]+'</b></div>').join('')+'</div><div class="barset"><div class="barrow"><span>رسائل واردة</span><div class="bartrack"><div class="barfill" style="--c:#2563EB;width:'+Math.min(100,replyEmails/Math.max(1,replyEmails)*100)+'%"></div></div><b>'+replyEmails+'</b></div><div class="barrow"><span>موافقات معلقة</span><div class="bartrack"><div class="barfill" style="--c:#F59E0B;width:'+Math.min(100,pending/Math.max(1,st.approvals.length)*100)+'%"></div></div><b>'+pending+'</b></div><div class="barrow"><span>مكتمل فنيًا</span><div class="bartrack"><div class="barfill" style="--c:#22C55E;width:'+Math.min(100,ready/total*100)+'%"></div></div><b>'+ready+'</b></div></div></div></div>'}
function dashboard(){let replied=replyCount(),pending=st.approvals.filter(x=>x.status==='pending').length;return '<div class="kpis">'+kpi('RFQ نشطة','1','طلبات الشراء النشطة','#2563EB','report','rfq')+kpi('الموردون',st.suppliers.length,'Supplier Pipeline','#06B6D4','users','suppliers')+kpi('الردود',replied,'رسائل واردة محفوظة','#EF4444','reply','responses')+kpi('موافقات معلقة',pending,'Approval Center','#F59E0B','clock','approvals')+'</div><div class="grid">'+panel('Supplier Pipeline Overview',icon('chart'),pipelineChart())+panel('Agent Activity',icon('spark'),st.activity.slice(0,8).map(x=>'<div class="log"><b>'+x.text+'</b><br><small class="muted">'+x.time+'</small></div>').join(''))+'</div>'+panel('Supplier Pipeline — RFQ-001',icon('users'),supplierTable())}
function supplierTable(){let labels={coolingLoadKw:'Cooling kW',storageTons:'Storage tons',dailyLoadingTpd:'tons/day',pullDown:'Pull-down',energyKwh24h:'kWh/24h'};return '<div style="overflow:auto"><table><thead><tr><th>المورد</th><th>الحالة</th><th>Compliance</th><th>البيانات الناقصة</th><th>الإجراء المطلوب</th></tr></thead><tbody>'+st.suppliers.map(s=>{let c=compliance(s),cl=c.score>=80?'high':c.score>=40?'mid':'low',mail=s.email||'البريد غير مؤكد',action=!s.email?'تحقق من بيانات التواصل':c.score<100?(hasReply(s)?'استخراج البيانات الفنية':'انتظار/متابعة الرد'):'جاهز للمقارنة';return '<tr><td><b>'+s.name+'</b><br><small class="muted">'+mail+'</small></td><td><span class="status">'+s.status+'</span></td><td><span class="score '+cl+'">'+c.score+'%</span></td><td><div class="missing">'+(c.missing.length?c.missing.map(x=>'<span class="chip">'+labels[x.key]+'</span>').join(''):'<span class="safe">✓ مكتمل</span>')+'</div></td><td><b>'+action+'</b><br><button class="btn" style="margin-top:6px" onclick="exclude(\''+s.id+'\','+!s.excluded+')">'+(s.excluded?'إلغاء الاستبعاد':'استبعاد')+'</button></td></tr>'}).join('')+'</tbody></table></div>'}
function rfqView(){let r=st.requests?.find(x=>x.id===st.project?.activeRfq)||st.requests?.[0]||{};let d=r.designBasis||{};return panel('تفاصيل طلب الشراء — '+(r.id||'RFQ'),icon('report'),'<div class="grid" style="grid-template-columns:1fr 1fr"><div><p><b>المشروع:</b> '+(r.title||st.project?.name||'-')+'</p><p><b>الحالة:</b> <span class="status">'+(r.status||'-')+'</span></p><p><b>تاريخ الإنشاء:</b> '+(r.createdAt||'-')+'</p></div><div><p><b>الاستخدام:</b> '+(d.application||'-')+'</p><p><b>درجة الحرارة:</b> '+(d.temperature||'-')+'</p><p><b>المقاسات:</b> '+((d.roomSizes||[]).join(' — ')||'-')+'</p></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="show(\'suppliers\')">عرض الموردين</button><button class="btn" onclick="show(\'quotes\')">مقارنة العروض</button></div>')}
function responses(){let replied=st.suppliers.filter(hasReply),unmatched=(st.gmailReplies||[]).filter(x=>!x.supplierId);let body=replied.length?'<div style="overflow:auto"><table><thead><tr><th>المورد</th><th>الحالة</th><th>البريد</th><th>الإجراء</th></tr></thead><tbody>'+replied.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td><span class="status">'+esc(x.status)+'</span></td><td>'+esc(x.email||'غير مؤكد')+'</td><td><button class="btn" onclick="openConversation(\''+x.id+'\')">فتح سجل المراسلات</button></td></tr>').join('')+'</tbody></table></div>':'<div class="muted">لا توجد ردود مرتبطة بمورد حتى الآن.</div>';if(unmatched.length)body+='<h3>ردود واردة غير مرتبطة بمورد</h3>'+unmatched.map(m=>'<div class="log"><b>'+esc(m.subject||'بدون عنوان')+'</b><br><small class="muted">'+esc(m.from||'')+' · '+esc(m.receivedAt||'')+'</small><p>'+esc((m.snippet||m.body||'').slice(0,300))+'</p></div>').join('');return panel('ردود الموردين',icon('reply'),body)}
function mailAttachmentHtml(m){let aa=m.attachments||[];if(!aa.length)return '';return '<div class="actions" style="margin-top:8px">'+aa.map(a=>'<a class="btn" target="_blank" rel="noopener" href="'+A+'gmail/attachment?messageId='+encodeURIComponent(m.messageId)+'&attachmentId='+encodeURIComponent(a.attachmentId)+'">مراجعة المرفق — '+esc(a.filename||'ملف')+'</a>').join('')+'</div>'}
function replyTypeLabel(t){return t==='quote_received'?'عرض/سعر مستلم':t==='quote_promised'?'وعد بإرسال العرض':t==='technical_reply'?'رد فني + كتالوج/مرفقات':t==='info_request'?'استفسار/طلب معلومات':'رد غير سعري'}
function translateUrl(text){return 'https://translate.google.com/?sl=auto&tl=ar&text='+encodeURIComponent(String(text||'').slice(0,5000))+'&op=translate'}
function mailTranslateHtml(m){let text=[m.subject||'',m.summary||'',m.body||m.snippet||''].filter(Boolean).join('\n\n');return '<a class="btn" target="_blank" rel="noopener" href="'+translateUrl(text)+'">ترجمة للعربية</a>'}
function openConversation(id){
  let x=(st.suppliers||[]).find(z=>z.id===id);if(!x)return toast('المورد غير موجود');
  let mails=supplierMails(id),acts=(st.activity||[]).filter(a=>a.supplierId===id||String(a.text||'').toLowerCase().includes(String(x.name||'').toLowerCase())),qs=(st.quotes||[]).filter(q=>q.supplierId===id);
  let timeline=mails.length?mails.map(m=>'<div class="log"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><b>'+esc(m.subject||'بدون عنوان')+'</b><span class="status">'+esc(replyTypeLabel(m.replyType))+'</span></div><small class="muted">'+esc(m.from||'')+' · '+esc(m.receivedAt||'')+'</small>'+(m.summary?'<div class="approval-details" style="display:block;margin-top:8px"><b>ملخص البريد</b><p>'+esc(m.summary)+'</p></div>':'')+'<div class="actions" style="margin-top:8px">'+mailTranslateHtml(m)+'</div><details style="margin-top:8px"><summary>عرض نص البريد الكامل</summary><p style="white-space:pre-wrap">'+esc(m.body||m.snippet||'')+'</p></details>'+mailAttachmentHtml(m)+'</div>').join(''):(acts.length?acts.map(a=>'<div class="log"><b>'+esc(a.text)+'</b><br><small class="muted">'+esc(a.time||'')+'</small></div>').join(''):'<div class="approval-details" style="display:block"><b>لا توجد رسائل محفوظة لهذا المورد في قاعدة البيانات الحالية.</b><p class="muted">الحالة المسجلة: '+esc(x.status||'—')+'.</p></div>');
  let html='<div class="actions"><button class="btn" onclick="show(\'responses\')">← العودة إلى ردود الموردين</button></div><div class="approval-details" style="display:block"><h3>'+esc(x.name)+'</h3><p>'+esc(x.email||'البريد غير مؤكد')+' · '+esc(x.status||'—')+'</p></div><h3>سجل المراسلات</h3>'+timeline+(qs.length?'<h3>العروض المستخرجة من السجل</h3>'+qs.map(q=>'<div class="approval"><b>'+esc(q.id)+'</b> · '+esc(q.evidenceClass||q.status||'')+'</div>').join(''):'');
  document.getElementById('view').innerHTML=panel('سجل المراسلات — '+esc(x.name),icon('reply'),html);window.scrollTo({top:0,behavior:'smooth'})
}
function suppliers(){return panel('الموردون',icon('users'),supplierTable())}
function quoteState(x,q){if(q)return 'عرض منظم';let m=supplierMails(x.id)[0];if(!m)return 'بانتظار العرض';if(m.replyType==='quote_received')return 'عرض مستلم — جاهز للاستخراج';if(m.replyType==='quote_promised')return 'وعد بإرسال العرض';if(m.replyType==='technical_reply')return 'رد فني + كتالوج للمراجعة';if(m.replyType==='info_request')return 'استفسار/طلب معلومات';return 'رد غير سعري'}
function openComparisonDetail(id){let x=(st.suppliers||[]).find(z=>z.id===id);if(!x)return toast('المورد غير موجود');let q=(st.quotes||[]).find(z=>z.supplierId===id),state=quoteState(x,q),acts=(st.activity||[]).filter(a=>String(a.text||'').toLowerCase().includes(String(x.name||'').toLowerCase()));let body='<div class="actions"><button class="btn" onclick="show(\'quotes\')">← العودة إلى المقارنة</button></div><div class="approval-details" style="display:block"><h3>'+esc(x.name)+'</h3><p><b>الحالة:</b> '+esc(state)+'</p><p><b>حالة المورد:</b> '+esc(x.status||'—')+'</p></div>';if(q){body+='<h3>العرض المنظم</h3><div class="approval-details" style="display:block"><p><b>الدليل:</b> '+esc(q.evidenceClass||'—')+'</p><p><b>أساس السعر:</b> '+esc(q.basis||'—')+'</p><p><b>البنود:</b><br>'+((q.items||[]).map(i=>esc(i.description)+' — $'+esc(i.unitPrice)+'/'+esc(i.unit)).join('<br>')||'—')+'</p><p><b>النواقص:</b> '+esc((q.missing||[]).join('، ')||'لا توجد نواقص مسجلة')+'</p></div>'}else{let mails=supplierMails(id),m=mails[0];if(m&&m.replyType==='quote_received'){body+='<h3>عرض مستلم — جاهز للاستخراج</h3><div class="approval-details" style="display:block"><p><b>العنوان:</b> '+esc(m.subject||'—')+'</p><p><b>المرسل:</b> '+esc(m.from||'—')+'</p><p style="white-space:pre-wrap">'+esc(m.body||m.snippet||'')+'</p><p class="muted">تم استلام عرض/سعر أو مرفق يُحتمل أنه عرض، لكن لم يُحوّل بعد إلى حقول مقارنة منظمة.</p></div>'}else if(m&&m.replyType==='quote_promised'){body+='<div class="approval-details" style="display:block"><b>وعد بإرسال العرض</b><p>لا يوجد عرض سعري فعلي لاستخراجه حتى الآن.</p></div>'}else if(m&&m.replyType==='info_request'){body+='<div class="approval-details" style="display:block"><b>استفسار/طلب معلومات</b><p>هذا رد من المورد، لكنه ليس عرض سعر.</p></div>'}else if(m){body+='<div class="approval-details" style="display:block"><b>رد غير سعري</b><p>وصل رد من المورد، لكن لا توجد بيانات سعرية واضحة لاستخراجها.</p></div>'}else{body+='<p class="muted">لم يصل عرض مسجل حتى الآن.</p>'}}document.getElementById('view').innerHTML=panel('تفاصيل المقارنة',icon('scale'),body);window.scrollTo({top:0,behavior:'smooth'})}
function quotes(){let qs=st.quotes||[],groups=[['cold_room_manufacturer','مصنّعو غرف التبريد الكاملة'],['panel_door_manufacturer','مصنّعو الألواح والأبواب']];let html='<div class="approval-details" style="display:block"><b>قاعدة المقارنة</b><p>الحالة تعتمد على الدليل الفعلي: عرض منظم، عرض مستلم جاهز للاستخراج، رد فني/كتالوج للمراجعة، وعد بإرسال العرض، استفسار، أو بانتظار العرض.</p></div>';groups.forEach(g=>{let ss=(st.suppliers||[]).filter(x=>x.category===g[0]);html+='<h3>'+g[1]+'</h3><div style="overflow:auto"><table><thead><tr><th>المورد</th><th>الحالة</th><th>السعر/الأساس</th><th>الإجراء</th></tr></thead><tbody>'+ss.map(x=>{let q=qs.find(z=>z.supplierId===x.id),price=q&&q.items&&q.items.length?q.items.map(i=>esc(i.description)+': $'+esc(i.unitPrice)+'/'+esc(i.unit)).join('<br>'):'—';return '<tr><td><b>'+esc(x.name)+'</b></td><td><span class="status">'+esc(quoteState(x,q))+'</span></td><td>'+price+(q&&q.basis?'<div class="muted">'+esc(q.basis)+'</div>':'')+'</td><td><button class="btn" onclick="openComparisonDetail(\''+x.id+'\')">فتح التفاصيل</button></td></tr>'}).join('')+'</tbody></table></div>'});let benchmarks=(st.suppliers||[]).filter(x=>x.category==='benchmark_only');if(benchmarks.length)html+='<h3>مراجع سعرية فقط — خارج المقارنة الرسمية</h3>'+benchmarks.map(x=>'<div class="approval"><b>'+esc(x.name)+'</b> — '+esc(x.status||'')+'</div>').join('');return panel('مقارنة عروض الأسعار',icon('scale'),html)}
function approvals(){return panel('Approval Center',icon('check'),st.approvals.map(a=>'<div class="approval"><b>'+esc(a.title)+'</b><div class="muted">'+esc(a.status)+'</div><div id="ad-'+a.id+'" class="approval-details" style="display:none">'+Object.entries(a.details||{}).map(function(e){return '<p><b>'+esc(e[0])+':</b> '+esc(e[1])+'</p>'}).join('')+'</div><div class="actions" style="margin-top:9px"><button class="btn" onclick="toggleApproval(\''+a.id+'\')">عرض التفاصيل</button><button class="btn primary" onclick="approve(\''+a.id+'\',\'approved\')">موافقة</button><button class="btn danger" onclick="approve(\''+a.id+'\',\'rejected\')">رفض</button></div></div>').join(''))}
function toggleApproval(id){let e=document.getElementById('ad-'+id);if(e)e.style.display=e.style.display==='none'?'block':'none'}
function market(){let m=(st.marketScans||[])[0];return panel('AI Market Intelligence',icon('chart'),'<div class="actions"><button class="btn primary" onclick="marketScan()">تشغيل تحليل RFQ-001</button><a class="btn" href="/request.html">طلب جديد</a></div>'+(m?'<div class="approval-details" style="display:block"><b>آخر تحليل '+esc(m.id)+'</b><p>المصادر: '+esc(m.sourceCount)+' · الثقة: '+esc(m.confidence)+'%</p><p>Low: '+esc(m.benchmark&&m.benchmark.low||'—')+' · Median: '+esc(m.benchmark&&m.benchmark.median||'—')+' · High: '+esc(m.benchmark&&m.benchmark.high||'—')+'</p></div>':'<p class="muted">لا يوجد تحليل محفوظ بعد.</p>'))}
async function marketScan(){let r=await fetch(A+'requests/RFQ-001/market-scan',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)return toast('تعذر التحليل');await load();show('market');toast('تم تحديث Market Intelligence')}
function agent(){let g=st.gmail||{},safe=st.settings?.dryRun||st.settings?.requirePerMessageApproval;return '<div class="grid">'+panel('Procurement AI Assistant',icon('spark'),'<div class="safe">🛡 '+(safe?'وضع الحماية مفعل — لا يوجد إرسال جماعي':'تحذير: راجع إعدادات الإرسال')+'</div><div style="margin-top:12px">Gmail: <b>'+(g.connected?'متصل':g.configured?'جاهز للربط':'يحتاج إعداد OAuth')+'</b></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="connectGmail()">ربط Gmail</button><button class="btn" onclick="sync()">مزامنة RFQ-001</button><button class="btn" onclick="followup()">متابعة الموردين</button></div>')+panel('صلاحيات الوكيل',icon('shield'),Object.entries(st.settings).map(([k,v])=>'<label style="display:flex;justify-content:space-between;padding:9px 0"><span>'+k+'</span><input type="checkbox" '+(v?'checked':'')+' onchange="setting(\''+k+'\',this.checked)"></label>').join(''))+'</div>'}function reports(){let ready=st.suppliers.filter(x=>compliance(x).score===100).length;return panel('التقارير',icon('report'),'<p>RFQ-001 — الموردون: '+st.suppliers.length+' — الردود/العروض: '+st.suppliers.filter(hasReply).length+' — العروض المدخلة: '+st.quotes.length+' — مكتملو المؤشرات الخمسة: '+ready+'</p><p class="muted">قاعدة القرار: '+(st.rfqCompliance?.rule||'')+'</p>')}
async function approve(id,status){let r=await fetch(A+'approvals/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok)return toast('تعذر تحديث الموافقة');await load();show('approvals');toast(status==='approved'?'تمت الموافقة':'تم الرفض')}async function exclude(id,excluded){await fetch(A+'suppliers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({excluded})});await load()}async function setting(k,v){await fetch(A+'settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:v})});await load()}function connectGmail(){location.href=A+'gmail/connect'}async function sync(){let r=await fetch(A+'gmail/sync',{method:'POST'}),x=await r.json();if(!r.ok)return toast(x.message||x.error||'فشل المزامنة');await load();toast('ردود واردة جديدة: '+x.added+' · مرتبطة: '+x.matched+' · غير مرتبطة: '+x.unmatched)}async function followup(){let r=await fetch(A+'agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'followup'})}),x=await r.json();if(!r.ok)return toast(x.message||x.error);await load();toast('تمت المتابعة: '+x.sent.length)}load();
</script></body></html>
