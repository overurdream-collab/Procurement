<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procurement Command Center</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;background:#f4f7fb;color:#142033}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#101d36;color:#fff;padding:24px 18px}.brand{font-weight:800;font-size:20px;margin-bottom:30px}.nav button{width:100%;text-align:right;border:0;background:transparent;color:#cdd7e8;padding:12px;border-radius:10px;margin:3px 0;font-size:14px}.nav button:hover,.nav button.on{background:#1d3157;color:#fff}.main{padding:26px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0;font-size:25px}.badge{background:#e7f0ff;color:#1c5fd4;padding:7px 11px;border-radius:999px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e6ebf3;border-radius:16px;padding:18px;box-shadow:0 4px 18px #15213a0a}.k{color:#738096;font-size:13px}.v{font-size:27px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel h2{font-size:17px;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid #edf0f5;text-align:right}.status{font-size:12px;padding:5px 8px;border-radius:999px;background:#edf3ff;color:#1f62c9}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 12px;cursor:pointer}.primary{background:#1f66d1;color:white}.soft{background:#eef3fa;color:#213a60}.danger{background:#fff0f0;color:#ad2c2c}.log{font-size:13px;padding:10px 0;border-bottom:1px solid #edf0f5}.mobile{display:none}.muted{color:#7c8799}.settings label{display:flex;justify-content:space-between;padding:9px 0}.approval{padding:12px;border:1px solid #e8edf5;border-radius:12px;margin:8px 0}.toast{position:fixed;left:20px;bottom:20px;background:#13213b;color:white;padding:11px 15px;border-radius:10px;display:none}
@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:16px 14px 80px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top h1{font-size:20px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#101d36;padding:8px;z-index:5;justify-content:space-around}.mobile button{background:transparent;border:0;color:white;font-size:12px;padding:7px}table{font-size:12px}.panel{overflow:auto}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Procurement AI</div><div class="nav"><button class="on" onclick="show('dashboard')">لوحة التحكم</button><button onclick="show('newrequest')">طلب شراء جديد</button><button onclick="show('suppliers')">الموردون</button><button onclick="show('quotes')">مقارنة العروض</button><button onclick="show('approvals')">الموافقات والاستثناءات</button><button onclick="show('agent')">الوكيل</button><button onclick="show('reports')">التقارير</button></div></aside><main class="main"><div class="top"><div><h1>Procurement Command Center</h1><div class="muted">Alharir shipping and export</div></div><span class="badge">RFQ-001</span></div><div id="view"></div></main></div><nav class="mobile"><button onclick="show('dashboard')">الرئيسية</button><button onclick="show('suppliers')">الموردون</button><button onclick="show('approvals')">الموافقات</button><button onclick="show('agent')">الوكيل</button></nav><div class="toast" id="toast"></div><script>
let st={};const A='/api/';async function load(){st=await fetch(A+'state').then(r=>r.json());show(location.hash.slice(1)||'dashboard')}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}function show(v){location.hash=v;let el=document.getElementById('view');if(v==='dashboard')el.innerHTML=dashboard();if(v==='newrequest')el.innerHTML=newrequest();if(v==='suppliers')el.innerHTML=suppliers();if(v==='quotes')el.innerHTML=quotes();if(v==='approvals')el.innerHTML=approvals();if(v==='agent')el.innerHTML=agent();if(v==='reports')el.innerHTML=reports()}function newrequest(){return '<div class="panel" style="margin-top:22px"><h2>طلب شراء جديد</h2><p class="muted">اكتب الطلب بحرية ثم أكمل الحقول التي تعرفها. يمكن تعديل الطلب قبل الاعتماد.</p><label>وصف الطلب</label><textarea id="rtext" style="width:100%;min-height:140px;padding:12px;margin:7px 0 12px" placeholder="مثال: نحتاج غرف تبريد للخضار والفواكه..."></textarea><div class="grid"><div><label>العنوان</label><input id="rtitle" style="width:100%;padding:10px" placeholder="اسم المشروع"></div><div><label>الصنف / الفئة</label><input id="rcat" style="width:100%;padding:10px" placeholder="cold_storage"></div><div><label>الاستخدام</label><input id="rapp" style="width:100%;padding:10px"></div><div><label>الموقع</label><input id="rloc" style="width:100%;padding:10px"></div></div><label style="display:block;margin-top:12px">المواصفات والمتطلبات المطلوبة (كل متطلب في سطر)</label><textarea id="rscope" style="width:100%;min-height:100px;padding:12px"></textarea><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="createRequest()">حفظ كمسودة</button></div></div><div class="panel" style="margin-top:16px"><h2>طلبات الشراء</h2>'+st.requests.map(r=>'<div class="approval"><b>'+r.id+' — '+r.title+'</b><div class="muted">'+r.status+'</div><div class="actions" style="margin-top:8px"><button class="btn soft" onclick="previewRequest(\''+r.id+'\')">معاينة RFQ</button>'+(r.status!=='معتمد'?'<button class="btn primary" onclick="approveRequest(\''+r.id+'\')">اعتماد</button>':'')+'</div></div>').join('')+'</div>'}function createRequest(){let b={title:document.getElementById('rtitle').value,source_text:document.getElementById('rtext').value,category:document.getElementById('rcat').value,application:document.getElementById('rapp').value,location:document.getElementById('rloc').value,scope:document.getElementById('rscope').value};fetch(A+'requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{let x=await r.json();if(!r.ok)return toast(x.error);await load();show('newrequest');toast('تم حفظ '+x.id+' كمسودة')})}async function previewRequest(id){let r=await fetch(A+'requests/'+id+'/preview'),x=await r.json();if(!r.ok)return toast(x.error);alert(x.rfq.subject+'\\n\\n'+x.rfq.body)}async function approveRequest(id){let r=await fetch(A+'requests/'+id+'/approve',{method:'POST'}),x=await r.json();if(!r.ok)return toast(x.error);await load();show('newrequest');toast('تم اعتماد '+id)}function dashboard(){let replied=st.suppliers.filter(x=>x.status==='رد').length;return '<div class="cards"><div class="card"><div class="k">RFQ نشطة</div><div class="v">1</div></div><div class="card"><div class="k">الموردون</div><div class="v">'+st.suppliers.length+'</div></div><div class="card"><div class="k">الردود</div><div class="v">'+replied+'</div></div><div class="card"><div class="k">موافقات معلقة</div><div class="v">'+st.approvals.filter(x=>x.status==='pending').length+'</div></div></div><div class="grid"><section class="panel"><h2>Supplier Pipeline — RFQ-001</h2>'+supplierTable()+'</section><section class="panel"><h2>Agent Activity</h2>'+st.activity.slice(0,8).map(x=>'<div class="log">'+x.text+'<br><small class="muted">'+x.time+'</small></div>').join('')+'</section></div>'}function supplierTable(){return '<table><thead><tr><th>المورد</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>'+st.suppliers.map(s=>'<tr><td>'+s.name+'<br><small class="muted">'+s.email+'</small></td><td><span class="status">'+s.status+'</span></td><td><button class="btn soft" onclick="exclude(\''+s.id+'\','+!s.excluded+')">'+(s.excluded?'إلغاء الاستبعاد':'استبعاد')+'</button></td></tr>').join('')+'</tbody></table>'}function suppliers(){return '<div class="panel" style="margin-top:22px"><h2>الموردون</h2>'+supplierTable()+'</div>'}function qv(v){return v===null||v===undefined||v===''?'—':v}function comparableQuote(q){return ['price','fob_price','currency','cooling_load_kw','refrigeration_capacity_kw','compressor_brand','compressor_model','evaporator_brand','evaporator_model','power_kwh_24h','panel_type','panel_thickness','fob_port','production_lead_time','warranty','payment_terms'].some(k=>qv(q[k])!=='—')}function quotes(){let qs=(st.quotes||[]).filter(comparableQuote),replies=(st.replies||[]);let table=qs.length?'<div style="overflow:auto"><table><thead><tr><th>المورد</th><th>السعر / FOB</th><th>العملة</th><th>الحمل التبريدي</th><th>الضاغط</th><th>المبخر</th><th>استهلاك 24 ساعة</th><th>العزل</th><th>ميناء FOB</th><th>مدة الإنتاج</th><th>الضمان</th><th>شروط الدفع</th><th>اكتمال البيانات</th></tr></thead><tbody>'+qs.map(q=>'<tr><td><b>'+qv(q.supplier)+'</b></td><td>'+qv(q.fob_price||q.price)+'</td><td>'+qv(q.currency)+'</td><td>'+qv(q.cooling_load_kw||q.refrigeration_capacity_kw)+'</td><td>'+qv([q.compressor_brand,q.compressor_model].filter(Boolean).join(' '))+'</td><td>'+qv([q.evaporator_brand,q.evaporator_model].filter(Boolean).join(' '))+'</td><td>'+qv(q.power_kwh_24h)+'</td><td>'+qv([q.panel_type,q.panel_thickness].filter(Boolean).join(' / '))+'</td><td>'+qv(q.fob_port)+'</td><td>'+qv(q.production_lead_time)+'</td><td>'+qv(q.warranty)+'</td><td>'+qv(q.payment_terms)+'</td><td>'+(q.coverage?q.coverage.percent+'%':Math.round((27-(q.missing_fields||[]).length)/27*100)+'%')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="muted">لا يوجد حتى الآن عرض سعر يحتوي بيانات قابلة للمقارنة.</div>';let replyBox=replies.length?'<div style="margin-top:18px"><h3>ردود وصلت بدون عرض سعر مكتمل</h3>'+replies.slice(0,10).map(r=>'<div class="approval"><b>'+qv(r.supplier)+'</b><div class="muted">'+qv(r.subject)+'</div><div>تم تسجيل الرد، لكنه لا يحتوي بيانات فنية أو تجارية كافية لإضافته إلى جدول المقارنة.</div></div>').join('')+'</div>':'';return '<div class="panel" style="margin-top:22px"><h2>مقارنة عروض الأسعار</h2>'+table+replyBox+'</div>'}function approvals(){let pending=st.approvals.filter(a=>a.status==='pending');return '<div class="panel" style="margin-top:22px"><h2>مركز الموافقات</h2>'+(pending.length?pending.map(a=>'<div class="approval"><b>'+a.title+'</b><div class="muted">بانتظار قرارك</div><div class="actions" style="margin-top:9px"><button class="btn primary" onclick="approve(\''+a.id+'\',\'approved\')">موافقة</button><button class="btn danger" onclick="approve(\''+a.id+'\',\'rejected\')">رفض</button></div></div>').join(''):'<div class="muted">لا توجد موافقات معلقة حاليًا.</div>')+'</div>'}function agent(){let g=st.gmail||{};return '<div class="grid" style="margin-top:22px"><section class="panel"><h2>Procurement Agent</h2><div>Gmail: <b>'+(g.connected?'متصل':g.configured?'جاهز للربط':'يحتاج إعداد OAuth')+'</b></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="connectGmail()">ربط Gmail</button><button class="btn soft" onclick="sync()">مزامنة RFQ-001</button><button class="btn soft" onclick="followup()">متابعة الموردين</button></div></section><section class="panel settings"><h2>صلاحيات الوكيل</h2>'+Object.entries(st.settings).map(([k,v])=>'<label><span>'+k+'</span><input type="checkbox" '+(v?'checked':'')+' onchange="setting(\''+k+'\',this.checked)"></label>').join('')+'</section></div>'}function reports(){return '<div class="panel" style="margin-top:22px"><h2>التقارير</h2><p>RFQ-001 — الموردون: '+st.suppliers.length+' — الردود: '+st.suppliers.filter(x=>x.status==='رد').length+' — العروض: '+st.quotes.length+'</p></div>'}async function approve(id,status){await fetch(A+'approvals/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await load();toast('تم تحديث الموافقة')}async function exclude(id,excluded){await fetch(A+'suppliers/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({excluded})});await load()}async function setting(k,v){await fetch(A+'settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[k]:v})});await load()}function connectGmail(){location.href=A+'gmail/connect'}async function sync(){let r=await fetch(A+'gmail/sync',{method:'POST'}),x=await r.json();if(!r.ok)return toast(x.error||'فشل الربط');await load();toast('ردود جديدة: '+x.added)}async function followup(){let r=await fetch(A+'agent/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'followup',source:'user'})}),x=await r.json();if(!r.ok)return toast(x.message||x.error);await load();toast('تمت المتابعة: '+x.sent.length)}load();
</script></body></html>
