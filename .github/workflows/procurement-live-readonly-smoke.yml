name: Production Read-only Smoke
on:
  push:
    branches: [fix/request-analysis-supplier-flow]
    paths: [.github/workflows/procurement-live-readonly-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify published health and anonymous access restrictions (no credentials)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://alharir-procurement-neon-trial.onrender.com';
          const paths=[
            ['/health/live',200],
            ['/',401],
            ['/api/system-status',401],
            ['/api/requests/NO-SUCH-ID/analysis',401]
          ];
          for(const [path,expected] of paths){
            const r=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(35000)});
            console.log(path,'status='+r.status,'expected='+expected);
            assert.equal(r.status,expected);
          }
          JS
