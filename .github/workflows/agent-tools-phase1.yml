name: ALHARIR Agent Tools Phase One
on:
  push:
    branches: [feat/procurement-agent-tools-phase1]
  pull_request:
    paths:
      - "procurement-agent-tools.js"
      - "server.js"
      - "public/workspace.html"
      - "public/workspace-view.js"
      - "test/procurement-agent*.test.js"
      - ".github/workflows/agent-tools-phase1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked project dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check procurement-agent-tools.js
          node --check server.js
          node --check public/workspace-view.js
          node --check test/procurement-agent-tools.test.js
          node --check test/procurement-agent-http.test.js
      - name: Phase-one tool tests and protected HTTP
        run: node --test test/procurement-agent-tools.test.js test/procurement-agent-http.test.js
      - name: Full existing Procurement regression
        run: npm test
