name: Protected free-hosting preview tests
on:
  push:
    branches:
      - fix/evidence-based-market-research-20261015
      - alharir-free-hosting-poc
    paths:
      - 'server.js'
      - 'staging-access.js'
      - 'staging-demo-data.json'
      - 'render.yaml'
      - 'test/staging-auth.test.js'
      - 'test/unified-market-search.test.js'
      - 'market-unified.js'
      - 'market-leads.js'
      - 'public/market-outreach.js'
      - 'test/market-lead-pipeline.test.js'
      - 'public/index.html'
      - '.github/workflows/staging-demo-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server.js'
      - 'staging-access.js'
      - 'staging-demo-data.json'
      - 'render.yaml'
      - 'test/staging-auth.test.js'
      - 'test/unified-market-search.test.js'
      - 'market-unified.js'
      - 'market-leads.js'
      - 'public/market-outreach.js'
      - 'test/market-lead-pipeline.test.js'
      - 'public/index.html'
      - '.github/workflows/staging-demo-tests.yml'
permissions:
  contents: read
jobs:
  private-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check server.js
          node --check staging-access.js
          node --check market-unified.js
          node --check market-leads.js
          node --check public/market-outreach.js
      - name: Test real HTTP authentication and synthetic-only sample
        run: node --test test/staging-auth.test.js test/unified-market-search.test.js test/market-lead-pipeline.test.js
