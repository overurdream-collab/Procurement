name: Procurement Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ "ui/ecilab-design-system", "feature/new-request-market-intelligence", "feature/request-intelligence-workspace" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check server.js
      - name: Start application
        run: |
          node server.js > /tmp/procurement.log 2>&1 &
          echo $! > /tmp/procurement.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/api/state >/tmp/state.json && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8787/ >/tmp/index.html
          curl -fsS http://127.0.0.1:8787/request.html >/tmp/request.html
          curl -fsS 'http://127.0.0.1:8787/workspace.html?id=RFQ-001' >/tmp/workspace.html
      - name: Inline UI script syntax check
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m)throw new Error('inline script missing');new Function(m[1]);"

      - name: API and UI assertions
        run: |
          grep -q '"activeRfq":"RFQ-001"' /tmp/state.json
          grep -q '"dryRun":true' /tmp/state.json
          grep -q '"requirePerMessageApproval":true' /tmp/state.json
          grep -q 'PROCUREMENT COMMAND CENTER' /tmp/index.html
          grep -q 'Compliance' /tmp/index.html
          grep -q 'AI Assistant' /tmp/index.html
          grep -q 'request.html' /tmp/index.html
          grep -q 'New Procurement Request' /tmp/request.html
          grep -q 'AI Market Intelligence' /tmp/request.html
          grep -q 'Request Intelligence Workspace' /tmp/workspace.html
          grep -q 'Procurement AI Copilot' /tmp/workspace.html
          grep -q 'Supplier Pipeline Overview' /tmp/index.html
          grep -q 'chart-grid' /tmp/index.html
          grep -q 'class="ic"' /tmp/index.html
          grep -q '#030A28' /tmp/index.html
      - name: Verify follow-up safety gate
        run: |
          code=$(curl -sS -o /tmp/followup.json -w "%{http_code}" -X POST             -H "Content-Type: application/json"             -d '{"action":"followup"}'             http://127.0.0.1:8787/api/agent/run)
          test "$code" = "409"
          grep -q 'dry_run_enabled' /tmp/followup.json
      - name: Verify request and market intelligence API
        run: |
          req=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"title":"Test Pump","product":"pump","quantity":"10","currency":"USD","incoterm":"FOB"}' http://127.0.0.1:8787/api/requests)
          id=$(node -e "let x=JSON.parse(process.argv[1]);process.stdout.write(x.id)" "$req")
          test -n "$id"
          scan=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{}' "http://127.0.0.1:8787/api/requests/$id/market-scan")
          node -e "let x=JSON.parse(process.argv[1]);if(!x.id||x.requestId!==process.argv[2]||typeof x.confidence!=='number')process.exit(1)" "$scan" "$id"
      - name: Verify request intelligence workspace and copilot
        run: |
          ws=$(curl -fsS http://127.0.0.1:8787/api/requests/RFQ-001/workspace)
          node -e "let x=JSON.parse(process.argv[1]);if(!x.workspace||!x.workspace.analysisRules||!x.workspace.scenarios)process.exit(1)" "$ws"
          cp=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"message":"التجميع والتركيب سيكون في صنعاء"}' http://127.0.0.1:8787/api/requests/RFQ-001/copilot)
          node -e "let x=JSON.parse(process.argv[1]);if(!x.executed||x.executed.length<1||!x.workspace.changeHistory.length)process.exit(1)" "$cp"
      - name: Verify conversational Procurement AI Copilot
        run: |
          ask=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"message":"كم عدد الموردين في RFQ-001؟"}' http://127.0.0.1:8787/api/requests/RFQ-001/copilot)
          node -e "let x=JSON.parse(process.argv[1]);if(x.intent!=='ask'||!/مورد/.test(x.reply))process.exit(1)" "$ask"
          spec=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"message":"ماهي مواصفات المواد في RFQ-001؟"}' http://127.0.0.1:8787/api/requests/RFQ-001/copilot)
          node -e "let x=JSON.parse(process.argv[1]);if(x.intent!=='ask'||!/0°C/.test(x.reply))process.exit(1)" "$spec"
          act=$(curl -fsS -X POST -H "Content-Type: application/json" -d '{"message":"أضف شرط أن المورد يجب أن يكون من الصين"}' http://127.0.0.1:8787/api/requests/RFQ-001/copilot)
          node -e "let x=JSON.parse(process.argv[1]);if(x.intent!=='act'||!x.executed.length||x.executed[0].status!=='Confirmed Decision')process.exit(1)" "$act"
      - name: Verify Market Intelligence and Approvals UI wiring
        run: |
          grep -F "if(v==='market')el.innerHTML=market()" public/index.html
          grep -F "show('approvals');toast" public/index.html
          curl -fsS -X POST -H "Content-Type: application/json" -d '{}' http://127.0.0.1:8787/api/requests/RFQ-001/market-scan | grep -q '"requestId":"RFQ-001"'
          curl -fsS -X PATCH -H "Content-Type: application/json" -d '{"status":"approved"}' http://127.0.0.1:8787/api/approvals/A1 | grep -q '"status":"approved"'
          curl -fsS -X PATCH -H "Content-Type: application/json" -d '{"status":"pending"}' http://127.0.0.1:8787/api/approvals/A1 | grep -q '"status":"pending"'
      - name: Verify reliable hash navigation and quote visibility
        run: |
          grep -F "window.addEventListener('hashchange'" public/index.html
          grep -F "function render(v)" public/index.html
          grep -F "function quotes()" public/index.html
      - name: Verify shared UI escape helper exists
        run: |
          grep -F "function esc(v)" public/index.html
      - name: Verify structured quote comparison
        run: |
          curl -fsS http://127.0.0.1:8787/api/state | grep -q '"Q-Emaar-001"'
          curl -fsS http://127.0.0.1:8787/api/state | grep -q '"panel_door_manufacturer"'
          grep -F "مصنّعو غرف التبريد الكاملة" public/index.html
          grep -F "مصنّعو الألواح والأبواب" public/index.html
      - name: Verify quote details interaction
        run: |
          grep -F "<details><summary class=\"btn\">فتح التفاصيل</summary>" public/index.html
          grep -F "تفاصيل العرض" public/index.html
      - name: Static responsive and RTL assertions
        run: |
          grep -q 'dir="rtl"' /tmp/index.html
          grep -q '@media(max-width:900px)' /tmp/index.html
          grep -q '@media(max-width:520px)' /tmp/index.html
          grep -q 'viewport-fit=cover' /tmp/index.html
          grep -q "localStorage.setItem('procurement-theme'" /tmp/index.html
          grep -q 'class="mobile"' /tmp/index.html
      - name: Stop application
        if: always()
        run: |
          test ! -f /tmp/procurement.pid || kill $(cat /tmp/procurement.pid) || true
          cat /tmp/procurement.log || true
