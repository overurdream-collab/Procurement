name: Procurement Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ["alharir-free-hosting-poc"]
    paths:
      - 'server.js'
      - 'public/index.html'
      - 'public/request.html'
      - 'public/workspace.html'
      - 'public/workspace-view.js'
      - 'public/workspace-view.css'
      - 'public/executive-report.js'
      - 'public/mail-correspondence.js'
      - 'procurement-reports.js'
      - 'gmail-request-link.js'
      - 'test/phase2-procurement.integration.test.js'
      - 'test/phase2-mail-correspondence.test.js'
      - '.github/workflows/smoke-test.yml'
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check server and browser script syntax
        run: |
          node --check server.js
          node --check procurement-reports.js
          node --check gmail-request-link.js
          node --check public/ops-dashboard.js
          node --check public/executive-report.js
          node --check public/mail-correspondence.js
          node --check public/workspace-view.js
          node --check public/agent-native-pilot.js
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['public/index.html','public/request.html','public/workspace.html']){
            const src=fs.readFileSync(file,'utf8');
            const scripts=[...src.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if(!scripts.length&&!src.includes('src="/workspace-view.js"'))throw Error('Missing page script: '+file);
            for(const [,script] of scripts)new Function(script);
          }
          NODE
      - name: Integrated staging access, new request, price rules, Gmail dates and attachments
        run: |
          node --test --test-concurrency=1 \
            test/staging-auth.test.js \
            test/procurement-reports.test.js \
            test/phase2-procurement.integration.test.js \
            test/phase2-mail-correspondence.test.js \
            test/navigation-report.contract.test.js \
            test/home-monthly-integration.test.js
